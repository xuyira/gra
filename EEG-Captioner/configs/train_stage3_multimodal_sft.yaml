stage: multimodal_sft
train_manifest: ${TUSZ_STAGE3_TRAIN_MANIFEST}
val_manifest: ${TUSZ_STAGE3_VAL_MANIFEST}
output_dir: ${TUSZ_STAGE3_RUN}
encoder_checkpoint: ${TUSZ_ENCODER_CHECKPOINT}
qwen_path: ${QWEN25_VL_PATH}
initial_checkpoint: ${TUSZ_STAGE2_CHECKPOINT}
seed: 42
device: cuda
dtype: bfloat16
attn_implementation: sdpa
local_files_only: true
batch_size: 1
gradient_accumulation_steps: 8
max_steps: 10000
learning_rate: 0.00005
warmup_steps: 500
weight_decay: 0.01
max_grad_norm: 1.0
caption_fraction: 0.25
lora_rank: 8
lora_alpha: 32
lora_dropout: 0.05
num_workers: 4
eval_steps: 500
eval_batches: 20
eval_batch_size: 1
log_steps: 20
cosine_decay: true
min_lr_ratio: 0.1
gradient_checkpointing: true
smoke_overfit: false
